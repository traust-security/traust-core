[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traust-core"
version = "0.1.0"
license = "Apache-2.0"
description = "traust platform API (v1): domain models, repositories, service interfaces, clients, config"
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format-nongpl]>=4.0",
    "pydantic>=2.6",
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6.0",
    "referencing>=0.30",
    "sqlalchemy>=2.0",
    "traust-contracts @ git+https://github.com/traust-security/traust-contracts.git@81143df7949917028b3910238d0a7bca5fe1278c",
    "traust-ledger @ git+https://github.com/traust-security/traust-ledger.git@461f00d1a935f50c0f504e0694b258873d12ccfe",
]

[project.scripts]
traust-server = "traust_core.v1.rest.server:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# The HTTP REST adapter (traust_core.v1.rest); nothing else in core imports these.
rest = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx2",
    "uvicorn>=0.30",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3",
    "ruff>=0.6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/traust_core"]

[tool.hatch.build.targets.sdist]
exclude = ["/.ci-venv", "/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Postgres (make db-up; TRAUST_TEST_DATABASE_URL)",
    "todo(slice, legacy): ported legacy scenario parked for a later slice; skipped until that slice enables it",
]

[tool.coverage.run]
source = ["traust_core"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
show_contexts = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
