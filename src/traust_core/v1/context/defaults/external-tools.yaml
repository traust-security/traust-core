# Tier 0: the pinned PATH-invoked scanners (contracts `external-tools`). Ships with
# traust-core and is read by `Context.register_toolchain`; nobody edits it at runtime.
# `expected` is the job-image install target and the workstation floor: advancing a pin is a
# reviewed change here (no check may auto-advance one). checkov and bicep are hard-pinned in
# providers/tools/cloud_config.py; pqc-scan is pinned by the security pack. Optional engines
# (mewt, AGPL) are not shipped: a row here is an install instruction for every adopter.
# `version_regex` is only needed where the first bare semver in the tool's version output is
# not the tool's own version.
tools:
  - name: opengrep
    version_cmd: ["opengrep", "--version"]
    upstream: {kind: github, ref: opengrep/opengrep}
    expected: "1.25.0"
    consumers: [secure-code-audit, vuln-scan]

  - name: gitleaks
    version_cmd: ["gitleaks", "version"]
    upstream: {kind: github, ref: gitleaks/gitleaks}
    expected: "8.30.1"
    consumers: [secure-code-audit, vuln-scan, dependency-watch]

  - name: syft
    version_cmd: ["syft", "--version"]
    upstream: {kind: github, ref: anchore/syft}
    expected: "1.48.0"
    consumers: [secure-container-audit, secure-code-audit]

  - name: grype
    version_cmd: ["grype", "--version"]
    upstream: {kind: github, ref: anchore/grype}
    expected: "0.115.0"
    consumers: [secure-container-audit, secure-code-audit]

  # AIR-GAPPED ONLY, adopter-provided (owner decision 2026-10-20). OSV is
  # queried through its API by default; a deployment with `access:
  # air-gapped` on the osv source in feeds.yaml runs osv-scanner offline
  # instead (docs/setup.md "Air-gapped OSV scanning"). The harness, the
  # install script and the job image do NOT install it or its database, so
  # it is in no profile (`consumers: []`). The row stays so `expected` names
  # the version we have tested, and the drift row keeps that pin current:
  # when osv-scanner is absent it compares the pin itself with upstream.
  - name: osv-scanner
    version_cmd: ["osv-scanner", "--version"]
    upstream: {kind: github, ref: google/osv-scanner}
    expected: "2.7.0"
    provided_by: adopter
    consumers: []

  - name: cosign
    version_cmd: ["cosign", "version"]
    upstream: {kind: github, ref: sigstore/cosign}
    expected: "3.1.1"
    consumers: [secure-container-audit, ledger-signing]
    # ⚠️ TRANSPARENCY-LOG HAZARD — read before bumping this pin.
    #
    # cosign v3 uploads signatures to the PUBLIC rekor.sigstore.dev BY
    # DEFAULT. For the ledger signing path that would publish the timing of
    # every disposition-ledger write to an irrevocable public log, couple
    # signing to Sigstore's availability, and inflate each signature from
    # ~390 B to ~3.8 KB (~84 MB rather than ~9 MB across a 22k-layer corpus).
    #
    # Suppressed by traust_ledger.integrity.signing.CosignBackend passing
    # `--use-signing-config=false --tlog-upload=false`. Both flags changed
    # meaning between v2 and v3 (`--tlog-upload=false` alone is REJECTED under
    # v3's default signing config, and `--output-signature` now hard-fails), so
    # a flag-based defence is not durable on its own.
    #
    # The durable guard is a POST-CONDITION, not a flag: CosignBackend inspects
    # the emitted bundle and REFUSES to return a signature containing
    # tlogEntries or RFC3161 timestamps unless transparency logging was asked
    # for explicitly. That check is version-independent — it verifies the
    # artifact rather than trusting the CLI contract.
    #
    # On bump: re-run traust-ledger/tests/test_cosign_v3.py. If
    # `test_bundle_carries_no_transparency_log_entry` or
    # `test_sign_refuses_to_emit_a_published_signature` fails, the new cosign
    # changed the contract again — fix the flags, do NOT relax the guard.
    signing_policy:
      transparency_log: forbidden   # ledger signatures must never be published

  - name: skopeo
    version_cmd: ["skopeo", "--version"]
    upstream: {kind: github, ref: containers/skopeo}
    expected: "1.23.0"
    consumers: [inventory-repositories, secure-container-audit]

  - name: yara
    version_cmd: ["yara", "--version"]
    upstream: {kind: github, ref: VirusTotal/yara}
    expected: "4.5.8"
    # The malware-family rule PACK ages faster than the engine — its
    # pin is watched separately by the `yara-rules-pin` drift row
    # (RL_RULES_SHA in python3 -m traust.cli adapters yara), not here.
    consumers: [secure-container-audit, secure-rpm-audit]

  - name: govulncheck
    version_cmd: ["govulncheck", "-version"]
    # first bare semver in `-version` output is the Go toolchain
    # ("Go: go1.26.4"), not the scanner — anchor on the module path
    version_regex: 'govulncheck@v(\d+)\.(\d+)\.(\d+)'
    upstream: {kind: goproxy, ref: golang.org/x/vuln}
    expected: "1.6.0"
    consumers: [secure-code-audit, secure-rpm-audit, triage]

  # The Go toolchain is not a scanner, but govulncheck's results depend on it:
  # standard-library vulnerabilities are reported relative to the Go version
  # doing the analysis, so the same repo scanned with two toolchains can yield
  # two different stdlib findings. Tracked here so that dependency is visible
  # and floored rather than ambient. `go version` prints "go version go1.26.6
  # <os>/<arch>"; the regex anchors on the go-prefixed release, and Go's
  # release tags are goX.Y.Z rather than vX.Y.Z, so no upstream: row -- drift
  # cannot compare it as semver and a wrong answer is worse than none.
  - name: go
    version_cmd: ["go", "version"]
    version_regex: 'go version go(\d+)\.(\d+)\.(\d+)'
    expected: "1.24.0"
    consumers: [secure-code-audit, secure-rpm-audit, triage]

  - name: pip-audit
    version_cmd: ["pip-audit", "--version"]
    upstream: {kind: pypi, ref: pip-audit}
    expected: "2.10.1"
    consumers: [secure-code-audit]

  - name: joern
    version_cmd: ["joern", "--version"]
    # MUST stay anchored on joern's own banner line. joern has no working
    # --version flag (verified 2026-08-11): the arg is unrecognized, so
    # the launcher prints its banner and falls through to the REPL, and
    # the surrounding output carries OTHER semvers — a JVM warning quotes
    # the install path (".../Cellar/joern/4.0.600/libexec/lib/
    # org.scala-lang.scala-library-3.8.3.jar"). The bare-first-semver
    # heuristic reads the brew Cellar PATH version by luck here and would
    # read the Scala jar's 3.8.3 on any layout without it — a wrong
    # number compared against a real upstream tag.
    version_regex: 'Version:\s*(\d+)\.(\d+)\.(\d+)'
    upstream: {kind: github, ref: joernio/joern}
    expected: "4.0.600"
    # The banner reports the BUILD string, which on a brew install is
    # "Version: HEAD+20260810-0912" — not a release semver. So this row
    # reports `unavailable` (untagged/HEAD build) on such installs rather
    # than a lag number; a tagged-release install compares normally.
    # Kept in the roster regardless: it is the job-image install target,
    # and `expected` governs that build whether or not the runtime probe
    # can confirm it. The probe must DEVNULL stdin — without
    # that, the fallthrough REPL reads the caller's input.
    consumers: [impact-analysis, secure-rpm-audit]
